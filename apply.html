<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanEase - Apply</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
background:linear-gradient(135deg,#0057B8,#16A34A);
padding:20px;
}

.container{
max-width:520px;
margin:auto;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
color:#0057B8;
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#16A34A;
font-weight:bold;
margin-bottom:20px;
}

label{
display:block;
margin:12px 0 6px;
font-weight:bold;
}

input,select{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
}

.summary{
background:#F0F9FF;
border-radius:12px;
padding:15px;
margin:18px 0;
}

.summary p{margin:8px 0;font-weight:bold;}

button{
width:100%;
padding:15px;
background:#0057B8;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{background:#00408A;}

.back{
display:block;
text-align:center;
margin-top:15px;
color:#0057B8;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>LoanEase</h1>
<p class="subtitle">Quick Loans • Better Tomorrow</p>

<form id="loanForm">

<label>Full Name</label>
<input type="text" name="fullName" required>

<label>Phone Number</label>
<input type="tel" name="phone" required>

<label>Email Address</label>
<input type="email" name="email" required>

<label>Country</label>
<input type="text" name="country" required>

<label>National ID / Passport</label>
<input type="text" name="idNumber" required>

<label>Credit Score PIN (Optional)</label>
<input type="text" name="pin">

<label>Loan Amount</label>
<select id="loanAmount" name="loanAmount" required>
<option value="">Select Amount</option>
<option value="300">USD 300</option>
<option value="500">USD 500</option>
<option value="1000">USD 1,000</option>
<option value="2000">USD 2,000</option>
<option value="5000">USD 5,000</option>
<option value="10000">USD 10,000</option>
<option value="20000">USD 20,000</option>
<option value="50000">USD 50,000</option>
</select>

<label>Purpose of Loan</label>
<select name="loanPurpose" required>
<option value="">Select Purpose</option>
<option>Medical</option>
<option>School Fees</option>
<option>Business</option>
<option>Rent</option>
<option>Farming</option>
<option>Personal Use</option>
<option>Others</option>
</select>

<label>Repayment Period</label>
<select name="repaymentPeriod" required>
<option value="">Select Period</option>
<option>1 Month</option>
<option>3 Months</option>
<option>6 Months</option>
<option>1 Year</option>
<option>2 Years</option>
</select>

<div class="summary">
<p>Processing Fee (10%): <span id="fee">USD 0</span></p>
<p>Total Amount Due: <span id="total">USD 0</span></p>
</div>

<button type="submit">Submit Application</button>

</form>

<a href="index.html" class="back">← Back to Home</a>

</div>

<script>
const amount=document.getElementById("loanAmount");
const fee=document.getElementById("fee");
const total=document.getElementById("total");

amount.addEventListener("change",()=>{
const value=Number(amount.value)||0;
const f=value*0.10;
fee.textContent="USD "+f.toFixed(2);
total.textContent="USD "+(value+f).toFixed(2);
});

document.getElementById("loanForm").addEventListener("submit",async(e)=>{
e.preventDefault();

const data=Object.fromEntries(new FormData(e.target).entries());

const res=await fetch("/api/apply",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result=await res.json();

alert("Application submitted successfully. Your ID: "+result.id);

e.target.reset();
fee.textContent="USD 0";
total.textContent="USD 0";
});
</script>

</body>
</html>
