<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanEase Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f8ff;padding:20px;}
.header{
background:#0a7cff;
color:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}
.card{
background:white;
padding:18px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}
.row{
display:flex;
justify-content:space-between;
margin:8px 0;
}
.status{
color:#ff9800;
font-weight:bold;
}
button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#0a7cff;
color:white;
font-size:16px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
<h2>LoanEase Admin Dashboard</h2>
<p>Manage loan applications</p>
</div>

<div class="card">
<div class="row">
<span><strong>Name</strong></span>
<span>John Doe</span>
</div>

<div class="row">
<span><strong>Phone</strong></span>
<span>+263 77 123 4567</span>
</div>

<div class="row">
<span><strong>Loan</strong></span>
<span>USD 10,000</span>
</div>

<div class="row">
<span><strong>Income</strong></span>
<span>USD 1,200</span>
</div>

<div class="row">
<span><strong>Status</strong></span>
<span class="status">Pending</span>
</div>

<button>Reply to Client</button>

</div>

</body>
</html>
