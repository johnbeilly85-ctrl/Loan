<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanEase - Apply</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#0057B8,#16A34A);
  padding:20px;
}

.container{
  max-width:600px;
  margin:20px auto;
  background:#fff;
  border-radius:15px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
  text-align:center;
  color:#0057B8;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
  color:#333;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:#fff;
}

input:focus,
select:focus{
  outline:none;
  border-color:#0057B8;
}

.summary{
  background:#f4f8fc;
  border-radius:10px;
  padding:18px;
  margin:20px 0;
  border-left:5px solid #0057B8;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  color:#333;
}

.summary-row.total{
  border-top:1px solid #ddd;
  padding-top:12px;
  font-size:18px;
  font-weight:bold;
  color:#0057B8;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:8px;
  background:#0057B8;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00408A;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#0057B8;
  text-decoration:none;
  font-weight:bold;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  text-align:center;
  font-weight:bold;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  background:#dcfce7;
  color:#166534;
}
</style>
</head>

<body>

<div class="container">

  <h1>LoanEase</h1>
  <p class="subtitle">Loan Application</p>

  <div id="message" class="message"></div>

  <form id="loanForm">

    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        name="fullName"
        placeholder="Enter your full name"
        required
      >
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      >
    </div>

    <div class="form-group">
      <label for="loanPurpose">Loan Purpose</label>
      <select id="loanPurpose" name="loanPurpose" required>
        <option value="">Select Purpose</option>
        <option value="School Fees">School Fees</option>
        <option value="Business">Business</option>
        <option value="Rent">Rent</option>
        <option value="Farming">Farming</option>
        <option value="Personal Use">Personal Use</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">Loan Amount (USD)</label>
      <input
        type="number"
        id="amount"
        name="amount"
        min="1"
        step="0.01"
        placeholder="Enter loan amount"
        required
      >
    </div>

    <div class="form-group">
      <label for="period">Repayment Period</label>
      <select id="period" name="period" required>
        <option value="">Select Period</option>
        <option value="1 Month">1 Month</option>
        <option value="3 Months">3 Months</option>
        <option value="6 Months">6 Months</option>
        <option value="12 Months">12 Months</option>
        <option value="24 Months">24 Months</option>
      </select>
    </div>

    <div class="summary">

      <div class="summary-row">
        <span>Loan Amount:</span>
        <strong>USD <span id="displayAmount">0.00</span></strong>
      </div>

      <div class="summary-row">
        <span>Processing Fee (10%):</span>
        <strong>USD <span id="displayFee">0.00</span></strong>
      </div>

      <div class="summary-row total">
        <span>Total Amount Due:</span>
        <strong>USD <span id="displayTotal">0.00</span></strong>
      </div>

    </div>

    <button type="submit" id="submitBtn">
      Submit Application
    </button>

  </form>

  <a href="/" class="back">← Back to Home</a>

</div>

<script>

const form = document.getElementById("loanForm");
const amountInput = document.getElementById("amount");

const displayAmount = document.getElementById("displayAmount");
const displayFee = document.getElementById("displayFee");
const displayTotal = document.getElementById("displayTotal");

const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");


// Calculate fee and total
function calculateLoan(){

  const amount = parseFloat(amountInput.value) || 0;

  const fee = amount * 0.10;
  const total = amount + fee;

  displayAmount.textContent = amount.toFixed(2);
  displayFee.textContent = fee.toFixed(2);
  displayTotal.textContent = total.toFixed(2);
}

amountInput.addEventListener("input", calculateLoan);


// Show message
function showMessage(text,type){

  message.textContent = text;

  message.className = "message " + type;

  message.style.display = "block";
}


// Submit application
form.addEventListener("submit", async function(e){

  e.preventDefault();

  const amount = parseFloat(amountInput.value);

  if(!amount || amount <= 0){

    showMessage("Please enter a valid loan amount.","error");

    return;
  }

  const period = document.getElementById("period").value;

  if(!period){

    showMessage("Please select a repayment period.","error");

    return;
  }

  const fee = amount * 0.10;
  const total = amount + fee;

  const applicationData = {

    fullName: document.getElementById("fullName").value.trim(),

    phone: document.getElementById("phone").value.trim(),

    loanPurpose: document.getElementById("loanPurpose").value,

    amount: amount,

    period: period,

    processingFee: fee,

    totalAmountDue: total

  };


  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  message.style.display = "none";


  try{

    const response = await fetch("/api/apply",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(applicationData)

    });


    const data = await response.json();


    if(response.ok){

      showMessage(
        data.message || "Application submitted successfully.",
        "success"
      );

      setTimeout(function(){

        window.location.href = "/success.html";

      },1000);

    }else{

      showMessage(
        data.message || "Unable to submit application.",
        "error"
      );

      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Application";

    }

  }catch(error){

    console.error(error);

    showMessage(
      "Unable to connect to the server. Please try again.",
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Application";

  }

});


// Initial calculation
calculateLoan();

</script>

</body>
</html>
