<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanEase</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0057B8,#16A34A);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.container{
text-align:center;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.18);
width:90%;
max-width:420px;
}

.logo{
display:flex;
justify-content:center;
margin-bottom:15px;
}

h1{
color:#0057B8;
font-size:34px;
margin-bottom:8px;
}

.tagline{
color:#16A34A;
font-weight:bold;
margin-bottom:18px;
}

.ecocash{
display:inline-block;
padding:8px 18px;
border:2px solid #0057B8;
border-radius:25px;
font-size:22px;
font-weight:bold;
margin-bottom:22px;
}

.eco-blue{color:#0057B8;}
.eco-red{color:#E11D2E;}

.btn{
display:block;
background:#0057B8;
color:white;
text-decoration:none;
padding:15px;
border-radius:30px;
font-size:18px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#00408A;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
<svg width="150" height="150" viewBox="0 0 160 160">
  <path d="M35 20 L35 130 L95 130" fill="none" stroke="#0057B8" stroke-width="18" stroke-linecap="round"/>
  <path d="M30 95 C60 120,105 95,135 60" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <rect x="72" y="35" width="45" height="28" rx="5" fill="#16A34A"/>
  <text x="94.5" y="53" text-anchor="middle" font-size="16" font-weight="bold" fill="white">$</text>
</svg>
</div>

<h1>LoanEase</h1>

<p class="tagline">Quick Loans • Better Tomorrow</p>

<div class="ecocash">
<span class="eco-blue">Eco</span><span class="eco-red">Cash</span>
</div>

<a href="apply.html" class="btn">Apply Now</a>

</div>

</body>
</html>
