<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanEase - Select Loan Amount</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f8ff;padding:20px;}
.container{
max-width:420px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.logo{width:120px;display:block;margin:0 auto 15px;}
h2{text-align:center;color:#003b8e;margin-bottom:8px;}
p{text-align:center;color:#666;margin-bottom:20px;}
.progress-box{margin-bottom:20px;}
.progress-text{display:flex;justify-content:space-between;color:#555;font-size:14px;}
.progress{height:8px;background:#d9e6ff;border-radius:10px;margin-top:8px;}
.bar{height:100%;width:40%;background:#0a7cff;border-radius:10px;}

.amount{
display:block;
width:100%;
padding:16px;
margin:12px 0;
background:white;
border:2px solid #0a7cff;
border-radius:15px;
text-decoration:none;
text-align:center;
font-size:20px;
font-weight:bold;
color:#003b8e;
transition:.3s;
}
.amount:hover{
background:#0a7cff;
color:white;
}
</style>
</head>
<body>

<div class="container">

<img src="logo.png" class="logo" alt="LoanEase">

<h2>Select Loan Amount</h2>
<p>Choose the amount you want to apply for.</p>

<div class="progress-box">
<div class="progress-text">
<span>Application Progress</span>
<span>40%</span>
</div>
<div class="progress">
<div class="bar"></div>
</div>
</div>

<a href="details.html?amount=2000" class="amount">USD 2,000</a>
<a href="details.html?amount=5000" class="amount">USD 5,000</a>
<a href="details.html?amount=10000" class="amount">USD 10,000</a>
<a href="details.html?amount=25000" class="amount">USD 25,000</a>
<a href="details.html?amount=50000" class="amount">USD 50,000</a>

</div>

</body>
</html>
